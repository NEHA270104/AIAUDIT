# Netlify Configuration for BRTNeura AI Audit Landing Page

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NETLIFY_USE_DRAWER = "false"

[functions]
  directory = "netlify/functions"

# Route API requests to the Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
