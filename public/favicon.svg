<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brtneura-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E82" />
      <stop offset="45%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>
  <!-- Crosshair ticks extending from the 4 sides -->
  <line x1="32" y1="5" x2="32" y2="14" stroke="url(#brtneura-logo-grad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="32" y1="50" x2="32" y2="59" stroke="url(#brtneura-logo-grad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="5" y1="32" x2="14" y2="32" stroke="url(#brtneura-logo-grad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="50" y1="32" x2="59" y2="32" stroke="url(#brtneura-logo-grad)" stroke-width="4.5" stroke-linecap="round" />
  <!-- Outer rounded square -->
  <rect x="14" y="14" width="36" height="36" rx="9" ry="9" stroke="url(#brtneura-logo-grad)" stroke-width="4.5" fill="none" />
  <!-- Inner concentric rounded square -->
  <rect x="23" y="23" width="18" height="18" rx="4.5" ry="4.5" stroke="url(#brtneura-logo-grad)" stroke-width="4" fill="none" />
</svg>